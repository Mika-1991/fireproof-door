<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防火玻璃門 專案看板</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#f5f3ef;--surface:#fff;--surface2:#f0ede8;
    --border:#e2ddd6;--text:#1a1714;--text2:#6b6560;--text3:#9e9890;
    --accent:#2c5f8a;--accent-light:#e8f0f7;
    --green:#2d6a4f;--green-light:#e8f4ee;
    --amber:#92400e;--amber-light:#fef3c7;
    --blue-light:#dbeafe;--blue-dark:#1e40af;
    --gray-light:#f1efe8;--gray:#5f5e5a;
    --radius:10px;--radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}

  .header{background:var(--text);color:#fff;padding:24px 40px 20px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header h1{font-size:20px;font-weight:500;letter-spacing:0.04em}
  .header-sub{font-size:12px;color:#aaa;margin-top:3px;font-family:'DM Mono',monospace}
  .pbar-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
  .pbar{flex:1;height:4px;background:#444;border-radius:2px;min-width:160px}
  .pbar-fill{height:100%;background:#4ade80;border-radius:2px;transition:width 0.5s}
  .pbar-label{font-size:12px;color:#aaa;min-width:32px;font-family:'DM Mono',monospace}

  .tabs{display:flex;background:var(--text);padding:0 40px;border-bottom:1px solid #333}
  .tab{padding:9px 18px;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
  .tab.active{color:#fff;border-bottom-color:#fff}
  .tab:hover:not(.active){color:#ccc}

  .content{padding:28px 40px;max-width:1060px;margin:0 auto}
  .pane{display:none}.pane.active{display:block}

  .refresh-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px}
  .refresh-btn{font-size:12px;color:var(--text2);cursor:pointer;padding:5px 12px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);transition:background 0.12s}
  .refresh-btn:hover{background:var(--surface2)}
  .last-sync{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
  .leg-dot{width:8px;height:8px;border-radius:50%}

  .phase{margin-bottom:32px}
  .phase-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .phase-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .phase-title{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase}

  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px;transition:border-color 0.15s}
  .task-card:hover{border-color:#c0b8ae}
  .task-card.done{opacity:0.5}
  .task-card.done .task-title{text-decoration:line-through;color:var(--text3)}
  .task-card.wall{border-left:3px solid #2c5f8a}
  .task-card.door{border-left:3px solid #c47d20}

  .task-body{flex:1;min-width:0}
  .task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
  .task-title{font-size:13px;font-weight:500}
  .task-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-top:3px;white-space:pre-line}
  .task-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:7px}

  .badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .badge-water{background:var(--accent-light);color:var(--accent)}
  .badge-ruiqi{background:var(--green-light);color:var(--green)}
  .badge-door{background:var(--amber-light);color:var(--amber)}
  .badge-mgmt{background:#fce7f3;color:#9d174d}
  .badge-taibei{background:var(--gray-light);color:var(--gray)}
  .badge-default{background:var(--surface2);color:var(--text2)}

  .status{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace}
  .s-active{background:var(--blue-light);color:var(--blue-dark)}
  .s-pending{background:var(--surface2);color:var(--text3)}
  .s-done{background:var(--green-light);color:var(--green)}

  .days-chip{font-size:10px;color:var(--text3);padding:2px 6px;border-radius:4px;background:var(--surface2);font-family:'DM Mono',monospace}
  .par-label{font-size:11px;color:var(--text3);margin:8px 0 5px;display:flex;align-items:center;gap:4px}
  .par-label::before{content:'';display:inline-block;width:14px;height:1px;background:currentColor}

  .loading{text-align:center;padding:60px 0;color:var(--text3);font-size:13px}
  .error-box{background:#fee2e2;border:1px solid #fca5a5;border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#991b1b;margin-bottom:16px}

  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;min-width:110px;flex:1}
  .stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
  .stat-value{font-size:22px;font-weight:500;font-family:'DM Mono',monospace}

  .vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:24px}
  .vendor-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .vendor-card.expired{opacity:0.5}
  .vendor-name{font-size:14px;font-weight:500;margin-bottom:8px}
  .vendor-name.strike{text-decoration:line-through}
  .vrow{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:3px;gap:8px}
  .cy{color:var(--green);font-weight:500}.cn{color:#991b1b}
  .phone{color:var(--accent);font-size:11px;font-family:'DM Mono',monospace}
  .note-box{background:var(--amber-light);border:1px solid #fcd34d;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:16px}
  .section-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;margin-top:20px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>防火玻璃門更換 專案</h1>
    <div class="header-sub">即時同步自 Google Sheets</div>
    <div class="pbar-wrap">
      <div class="pbar"><div class="pbar-fill" id="pbar-fill" style="width:0%"></div></div>
      <span class="pbar-label" id="pbar-label">0%</span>
    </div>
  </div>
  <div style="font-size:12px;color:#888;font-family:'DM Mono',monospace" id="header-date"></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('sched')">排程 &amp; 工作</div>
  <div class="tab" onclick="switchTab('vendor')">廠商資訊</div>
</div>

<div class="content">
  <div class="pane active" id="pane-sched">
    <div class="refresh-row">
      <span class="last-sync" id="last-sync">讀取中...</span>
      <button class="refresh-btn" onclick="loadData()">重新整理</button>
    </div>
    <div class="stat-row" id="stat-row"></div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#2c5f8a"></div>水電</div>
      <div class="leg"><div class="leg-dot" style="background:#2d6a4f"></div>瑞其</div>
      <div class="leg"><div class="leg-dot" style="background:#92400e"></div>防火門廠商</div>
      <div class="leg"><div class="leg-dot" style="background:#9d174d"></div>管委會</div>
      <div class="leg"><div class="leg-dot" style="background:#5f5e5a"></div>大台北</div>
    </div>
    <div id="phases-container"><div class="loading">資料載入中...</div></div>
  </div>

  <div class="pane" id="pane-vendor">
    <div class="refresh-row">
      <span class="last-sync" id="last-sync-v">讀取中...</span>
      <button class="refresh-btn" onclick="loadData()">重新整理</button>
    </div>
    <div id="vendor-container"><div class="loading">資料載入中...</div></div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzlBf8MDUSbu4LdZc9skhktM-qGu3m92c_e4bQb5nTvmgDEwOjQ-4GU9jw_Wd3qadtH/exec';
const PHASE_ORDER = ['0. 報價&簽約','1. 開工前','2. 施工期間','3. 驗收'];
const PHASE_DOTS  = {'0. 報價&簽約':'#92400e','1. 開工前':'#2d6a4f','2. 施工期間':'#185FA5','3. 驗收':'#5f5e5a'};

function ownerBadge(o) {
  if (!o) return 'badge-default';
  const s = o.toLowerCase();
  if (s.includes('水電')) return 'badge-water';
  if (s.includes('瑞其')) return 'badge-ruiqi';
  if (s.includes('防火門')) return 'badge-door';
  if (s.includes('管委會')) return 'badge-mgmt';
  if (s.includes('大台北')) return 'badge-taibei';
  return 'badge-default';
}

function statusChip(s) {
  if (s === '完成')   return '<span class="status s-done">完成</span>';
  if (s === '進行中') return '<span class="status s-active">進行中</span>';
  return '<span class="status s-pending">未開始</span>';
}

function parallelClass(seq, loc) {
  if ((seq||'').toString().trim() !== '同時進行') return '';
  if ((loc||'').trim() === '形象牆') return 'wall';
  if ((loc||'').trim() === '防火門') return 'door';
  return '';
}

async function loadData() {
  document.getElementById('last-sync').textContent = '讀取中...';
  document.getElementById('last-sync-v').textContent = '讀取中...';
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const tasks = json.tasks || [];
    const vendors = json.vendors || [];
    renderTasks(tasks);
    renderVendors(vendors);
    const now = new Date();
    const t = now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('last-sync').textContent = '上次同步：' + t;
    document.getElementById('last-sync-v').textContent = '上次同步：' + t;
    document.getElementById('header-date').textContent =
      now.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});
  } catch(e) {
    const err = '<div class="error-box">無法讀取資料。請確認 Apps Script 已部署為網頁應用程式且設定為「所有人可存取」。<br>錯誤：' + e.message + '</div>';
    document.getElementById('phases-container').innerHTML = err;
    document.getElementById('vendor-container').innerHTML = err;
    document.getElementById('last-sync').textContent = '同步失敗';
    document.getElementById('last-sync-v').textContent = '同步失敗';
  }
}

function renderTasks(rows) {
  const total = rows.length;
  const done  = rows.filter(r => r['狀態'] === '完成').length;
  const active = rows.filter(r => r['狀態'] === '進行中').length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pbar-fill').style.width = pct + '%';
  document.getElementById('pbar-label').textContent = pct + '%';
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card"><div class="stat-label">總任務</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">完成</div><div class="stat-value" style="color:#2d6a4f">${done}</div></div>
    <div class="stat-card"><div class="stat-label">進行中</div><div class="stat-value" style="color:#1e40af">${active}</div></div>
    <div class="stat-card"><div class="stat-label">未開始</div><div class="stat-value" style="color:#9e9890">${total-done-active}</div></div>`;

  const grouped = {};
  PHASE_ORDER.forEach(p => grouped[p] = []);
  rows.forEach(r => {
    const ph = r['時間點'] || '';
    const key = PHASE_ORDER.find(p => ph.startsWith(p.split('.')[0].trim())) || ph;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  });

  const con = document.getElementById('phases-container');
  con.innerHTML = '';
  PHASE_ORDER.forEach(phase => {
    const tasks = grouped[phase] || [];
    if (!tasks.length) return;
    const div = document.createElement('div');
    div.className = 'phase';
    div.innerHTML = `<div class="phase-hdr">
      <div class="phase-dot" style="background:${PHASE_DOTS[phase]||'#888'}"></div>
      <div class="phase-title">${phase}</div></div>`;

    let lastPar = '';
    tasks.forEach(t => {
      const par = parallelClass(t['順序'], t['位置']);
      const isDone = t['狀態'] === '完成';
      if (par && par !== lastPar) {
        const pl = document.createElement('div');
        pl.className = 'par-label';
        pl.style.color = par === 'wall' ? '#2c5f8a' : '#c47d20';
        pl.textContent = par === 'wall' ? '形象牆' : '防火門';
        div.appendChild(pl);
      }
      lastPar = par;
      const card = document.createElement('div');
      card.className = `task-card ${par} ${isDone ? 'done' : ''}`;
      card.innerHTML = `
        <div class="task-body">
          <div class="task-top">
            <span class="task-title">${t['做什麼']||''}</span>
          </div>
          ${t['備註'] ? `<div class="task-desc">${t['備註']}</div>` : ''}
          <div class="task-meta">
            <span class="badge ${ownerBadge(t['對應窗口'])}">${t['對應窗口']||''}</span>
            ${statusChip(t['狀態'])}
            ${t['預計工作天'] ? `<span class="days-chip">${t['預計工作天']} 天</span>` : ''}
          </div>
        </div>`;
      div.appendChild(card);
    });
    con.appendChild(div);
  });
}

function renderVendors(vendors) {
  const con = document.getElementById('vendor-container');
  con.innerHTML = '';

  const hasExpired = vendors.some(v => v['備註'] && v['備註'].includes('過期'));
  if (hasExpired) {
    const nb = document.createElement('div');
    nb.className = 'note-box';
    nb.textContent = '九龍防火認證已過期，無法提供認證文件，不列入考慮。';
    con.appendChild(nb);
  }

  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = '廠商比較';
  con.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'vendor-grid';

  vendors.forEach(v => {
    const expired = v['備註'] && v['備註'].includes('過期');
    const card = document.createElement('div');
    card.className = 'vendor-card' + (expired ? ' expired' : '');
    const cols = Object.keys(v).filter(k => k !== '廠商' && k !== '備註' && v[k]);
    let rows = cols.map(k => {
      const val = v[k];
      const isPhone = k === '電話';
      const isO = val === 'O';
      const isX = val === 'X';
      return `<div class="vrow"><span>${k}</span><span class="${isPhone?'phone':isO?'cy':isX?'cn':''}">${val}</span></div>`;
    }).join('');
    if (v['備註']) rows += `<div class="vrow" style="color:#991b1b;font-size:11px">${v['備註']}</div>`;
    card.innerHTML = `<div class="vendor-name${expired?' strike':''}">${v['廠商']}</div>${rows}`;
    grid.appendChild(card);
  });
  con.appendChild(grid);

  const infoLabel = document.createElement('div');
  infoLabel.className = 'section-label';
  infoLabel.textContent = '申報資訊';
  con.appendChild(infoLabel);
  con.insertAdjacentHTML('beforeend', `
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="vendor-card" style="min-width:160px"><div class="vendor-name">都發局窗口</div><div class="vrow"><span>聯絡人</span><span>賴先生</span></div></div>
      <div class="vendor-card" style="min-width:160px"><div class="vendor-name">申報公司</div><div class="vrow"><span>大台北</span><span>許先生</span></div></div>
    </div>`);
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['sched','vendor'][i] === id));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-'+id));
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
